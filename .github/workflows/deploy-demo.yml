name: Deploy APEX Drive Time Trial

on:
  push:
    branches: [main]
    paths:
      - 'apps/apex-demo/**'
      - 'apex-drive/**'
      - 'packages/apex-assets/**'
      - 'packages/apex-audio/**'
      - 'packages/apex-car/**'
      - 'packages/apex-contracts/**'
      - 'packages/apex-physics/**'
      - 'packages/apex-ether/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build APEX Drive Time Trial
        run: corepack pnpm --filter @jvsysarch/apex-demo build
        env:
          VITE_APEX_VOID_PUBLIC_URL: https://apex-void-production-e06c.up.railway.app
          VITE_APEX_VOID_WORLD_ID: bf58f8d7-ac0f-42bb-84d7-2b3fe25e0a30
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/apex-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
